name: Deploy ZShop (CD)

on:
  workflow_dispatch: # Cho phép ấn nút deploy thủ công trên GitHub

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: zshop_api
  FRONTEND_IMAGE_NAME: zshop_web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./FE/web-app
          file: ./FE/web-app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          build-args: |
            REACT_APP_API_BASE_URL=${{ secrets.REACT_APP_API_BASE_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            cd /hoangcn/zshop
            
            # Login lại vào GHCR trên server (cần truyền token qua biến môi trường hoặc cấu hình sẵn)
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Kéo (pull) image mới nhất về máy chủ
            docker compose pull
            
            # Khởi động lại các container mới (những container cũ/không thay đổi sẽ giữ nguyên)
            docker compose up -d --remove-orphans
            
            # Xóa các image rác cũ để giải phóng dung lượng ổ cứng
            docker image prune -f
