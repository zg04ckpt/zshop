version: '3.8'

services:
  zshop_api:
    container_name: zshop_api
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/zshop_api:latest
    ports:
      - "5004:8080"
    volumes:
      - backend_logs:/app/logs
      - backend_resources:/app/resources
    env_file:
      - .env
    networks:
      - default_net

  zshop_web:
    container_name: zshop_web
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/zshop_web:latest
    ports:
      - "5005:80"
    env_file:
      - .env
    networks:
      - default_net

volumes:
  backend_logs:
  backend_resources:

networks:
  default_net:
    external: true
